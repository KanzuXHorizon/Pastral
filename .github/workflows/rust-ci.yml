name: Rust foundation CI

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/agent/**"
      - "crates/agent-core/**"
      - "crates/domain/**"
      - "crates/storage/**"
      - "crates/clipboard-win/**"
      - "eng/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/agent/**"
      - "crates/agent-core/**"
      - "crates/domain/**"
      - "crates/storage/**"
      - "crates/clipboard-win/**"
      - "eng/**"
      - ".github/workflows/rust-ci.yml"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        shell: powershell
        run: ./eng/verify-toolchain.ps1
      - name: Format
        shell: powershell
        run: cargo fmt --all -- --check
      - name: Check
        shell: powershell
        run: cargo check --locked --workspace --all-targets
      - name: Test workspace
        shell: powershell
        run: cargo test --locked --workspace --all-targets
      - name: Test storage foundation
        shell: powershell
        run: cargo test --locked -p pastral-storage --all-targets
      - name: Verify diagnostic agent
        shell: powershell
        run: ./eng/verify-agent.ps1 -Mode All
      - name: Clippy
        shell: powershell
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Documentation
        shell: powershell
        run: cargo doc --locked --workspace --no-deps
      - name: Dependency policy
        shell: powershell
        run: ./eng/verify-dependencies.ps1
      - name: Source policy
        shell: powershell
        run: ./eng/verify-source-policy.ps1
