name: Rust foundation CI

on:
  push:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/agent/**"
      - "apps/agent-ipc-probe/**"
      - "apps/ipc-probe/**"
      - "apps/ipc-transport-probe/**"
      - "apps/manager/Pastral.Manager/**"
      - "crates/agent-core/**"
      - "crates/clipboard-win/**"
      - "crates/domain/**"
      - "crates/ipc-auth/**"
      - "crates/ipc-core/**"
      - "crates/ipc-schema/**"
      - "crates/ipc-win/**"
      - "crates/manager-ipc-bridge/**"
      - "crates/storage/**"
      - "protocols/ipc-schema/**"
      - "eng/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/agent/**"
      - "apps/agent-ipc-probe/**"
      - "apps/ipc-probe/**"
      - "apps/ipc-transport-probe/**"
      - "apps/manager/Pastral.Manager/**"
      - "crates/agent-core/**"
      - "crates/clipboard-win/**"
      - "crates/domain/**"
      - "crates/ipc-auth/**"
      - "crates/ipc-core/**"
      - "crates/ipc-schema/**"
      - "crates/ipc-win/**"
      - "crates/manager-ipc-bridge/**"
      - "crates/storage/**"
      - "protocols/ipc-schema/**"
      - "eng/**"
      - ".github/workflows/rust-ci.yml"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Install exact protoc 35.0
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'protoc-35.0-win64.zip'
          $root = Join-Path $env:RUNNER_TEMP 'protoc-35.0'
          Invoke-WebRequest `
            -Uri 'https://github.com/protocolbuffers/protobuf/releases/download/v35.0/protoc-35.0-win64.zip' `
            -OutFile $archive
          $expected = 'd1cede9e308cc3eb072392af1c02ccae4bdd3d2f374ec2970dbd8cdfdaa91363'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "protoc archive hash mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $protoc = Join-Path $root 'bin\protoc.exe'
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $protoc) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = (& $protoc --version).Trim()
          if ($version -ne 'libprotoc 35.0') {
            throw "unexpected protoc version: $version"
          }
      - name: Verify toolchain
        shell: powershell
        run: ./eng/verify-toolchain.ps1
      - name: Format
        shell: powershell
        run: cargo fmt --all -- --check
      - name: Check
        shell: powershell
        run: cargo check --locked --workspace --all-targets
      - name: Test workspace
        shell: powershell
        run: cargo test --locked --workspace --all-targets
      - name: Verify IPC prototype
        shell: powershell
        run: ./eng/verify-ipc-prototype.ps1 -Mode All
      - name: Verify authenticated IPC transport
        shell: powershell
        run: ./eng/verify-ipc-transport.ps1 -Mode All
      - name: Verify agent IPC admission
        shell: powershell
        run: ./eng/verify-agent-ipc-admission.ps1 -Mode All
      - name: Verify manager IPC bridge policy
        shell: powershell
        run: ./eng/verify-manager-ipc-bridge.ps1 -Mode Static
      - name: Test manager IPC bridge
        shell: powershell
        run: ./eng/verify-manager-ipc-bridge.ps1 -Mode Test
      - name: Test storage foundation
        shell: powershell
        run: cargo test --locked -p pastral-storage --all-targets
      - name: Verify diagnostic agent
        shell: powershell
        run: ./eng/verify-agent.ps1 -Mode All
      - name: Clippy
        shell: powershell
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Documentation
        shell: powershell
        run: cargo doc --locked --workspace --no-deps
      - name: Dependency policy
        shell: powershell
        run: ./eng/verify-dependencies.ps1
      - name: Source policy
        shell: powershell
        run: ./eng/verify-source-policy.ps1
