name: Native manager UI CI

on:
  push:
    paths:
      - "Pastral.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "apps/manager/**"
      - "eng/**"
      - ".github/workflows/native-ui-ci.yml"
  pull_request:
    paths:
      - "Pastral.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "apps/manager/**"
      - "eng/**"
      - ".github/workflows/native-ui-ci.yml"

permissions:
  contents: read

jobs:
  manager:
    # Keep the v143 C++/WinUI toolchain stable. The floating windows-2025 label
    # can resolve to Visual Studio 2026 images that do not satisfy this project.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install exact protoc 35.0
        shell: powershell
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'protoc-35.0-win64.zip'
          $root = Join-Path $env:RUNNER_TEMP 'protoc-35.0'
          Invoke-WebRequest `
            -Uri 'https://github.com/protocolbuffers/protobuf/releases/download/v35.0/protoc-35.0-win64.zip' `
            -OutFile $archive
          $expected = 'd1cede9e308cc3eb072392af1c02ccae4bdd3d2f374ec2970dbd8cdfdaa91363'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "protoc archive hash mismatch: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $protoc = Join-Path $root 'bin\protoc.exe'
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $protoc) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $version = (& $protoc --version).Trim()
          if ($version -ne 'libprotoc 35.0') {
            throw "unexpected protoc version: $version"
          }

      - name: Ensure C++ WinUI build tools
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $required = & $vswhere -latest -products * -requires `
            Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            Microsoft.VisualStudio.ComponentGroup.WindowsAppDevelopment.VC.BuildTools `
            -property installationPath

          if ([string]::IsNullOrWhiteSpace($required)) {
            $installPath = (& $vswhere -latest -products * -property installationPath).Trim()
            if ([string]::IsNullOrWhiteSpace($installPath)) {
              throw 'No Visual Studio installation is available to modify.'
            }

            $setup = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\setup.exe'
            & $setup modify `
              --installPath $installPath `
              --add Microsoft.VisualStudio.Workload.UniversalBuildTools `
              --add Microsoft.VisualStudio.ComponentGroup.WindowsAppDevelopment.VC.BuildTools `
              --quiet --norestart --wait
            if ($LASTEXITCODE -ne 0) {
              throw "Visual Studio Installer failed with exit code $LASTEXITCODE."
            }

            $deadline = [DateTime]::UtcNow.AddMinutes(15)
            do {
              Start-Sleep -Seconds 10
              $required = & $vswhere -latest -products * -requires `
                Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                Microsoft.VisualStudio.ComponentGroup.WindowsAppDevelopment.VC.BuildTools `
                -property installationPath
            } while ([string]::IsNullOrWhiteSpace($required) -and [DateTime]::UtcNow -lt $deadline)

            if ([string]::IsNullOrWhiteSpace($required)) {
              throw 'C++ WinUI build tools were not detected after installation.'
            }
          }

          Write-Host "Native manager Visual Studio: $required"

      - name: Verify native toolchain
        shell: powershell
        run: ./eng/verify-toolchain.ps1 -RequireNativeManager

      - name: Verify native source and XAML policy
        shell: powershell
        run: ./eng/verify-native-manager.ps1 -Mode Static

      - name: Verify native manager IPC bridge
        shell: powershell
        run: ./eng/verify-manager-ipc-bridge.ps1 -Mode Probe

      - name: Build Debug and Release
        shell: powershell
        run: ./eng/verify-native-manager.ps1 -Mode Build

      - name: Verify repository source policy
        shell: powershell
        run: ./eng/verify-source-policy.ps1
