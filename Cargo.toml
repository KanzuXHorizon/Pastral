[workspace]
members = [
    "crates/agent-core",
    "crates/clipboard-win",
    "crates/domain",
    "crates/storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Pastral contributors"]
repository = "https://github.com/pastral/pastral"

[workspace.dependencies]
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled", "blob"] }
sha2 = { version = "=0.10.9", default-features = false }
uuid = { version = "=1.18.1", default-features = false, features = ["std", "v4"] }
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
