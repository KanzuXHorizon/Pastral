[workspace]
members = [
    "apps/agent",
    "apps/agent-ipc-probe",
    "apps/ipc-probe",
    "apps/ipc-transport-probe",
    "crates/agent-core",
    "crates/clipboard-win",
    "crates/domain",
    "crates/ipc-auth",
    "crates/ipc-core",
    "crates/ipc-schema",
    "crates/ipc-win",
    "crates/manager-ipc-bridge",
    "crates/storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Pastral contributors"]
repository = "https://github.com/pastral/pastral"

[workspace.dependencies]
hmac = { version = "=0.12.1", default-features = false }
protobuf = { version = "=4.35.0-release", default-features = false }
protobuf-codegen = { version = "=4.36.0-rc.1", default-features = false }
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled", "blob"] }
sha2 = { version = "=0.10.9", default-features = false }
uuid = { version = "=1.18.1", default-features = false, features = ["std", "v4"] }
zeroize = { version = "=1.8.2", default-features = false, features = ["alloc"] }
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
