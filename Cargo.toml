[workspace]
members = ["crates/domain"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["Pastral contributors"]
repository = "https://github.com/pastral/pastral"

[workspace.dependencies]
sha2 = { version = "=0.10.9", default-features = false }
uuid = { version = "=1.18.1", default-features = false, features = ["std", "v4"] }
